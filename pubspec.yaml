name: satva_dhara_erp
description: "Satva Dhara Dairy Farm ERP - Phase 1 Foundation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^17.4.0

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6

  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  logger: ^2.3.0

  fl_chart: ^1.2.0
  cached_network_image: ^3.3.1
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/logo/satva_dhara_logo.jpg
